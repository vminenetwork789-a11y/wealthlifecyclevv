    <script>
      (function() {
        // Safe-guard window.top and window.parent in cross-origin iframes (for Web3 wallet extensions like Bitget/BitKeep/MetaMask)
        try {
          if (window.parent !== window) {
            try {
              var _dummy = window.parent.location.origin;
            } catch (err) {
              // Cross-origin iframe detected: shadow parent and top so inpage.js doesn't crash on window.top.location.origin
              try {
                Object.defineProperty(window, 'parent', {
                  get: function() { return window; },
                  configurable: true
                });
              } catch (_) {}
              try {
                Object.defineProperty(window, 'top', {
                  get: function() { return window; },
                  configurable: true
                });
              } catch (_) {}
            }
          }
        } catch (_) {}

        function isExtensionOrCrossOriginError(msg, src) {
          if (!msg && !src) return false;
          var str = String(msg || '') + ' ' + String(src || '');
          return (
            str.indexOf('Blocked a frame with origin') !== -1 ||
            str.indexOf('Failed to read a named property') !== -1 ||
            str.indexOf('SecurityError') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('inpage.js') !== -1 ||
            str.indexOf('WebSocket closed without opened') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('@vite/client') !== -1
          );
        }

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          var src = (e && e.filename) || '';
          if (isExtensionOrCrossOriginError(msg, src)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e ? e.reason : null;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isExtensionOrCrossOriginError(msg, '')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          var errStr = String(msg || '') + ' ' + String(url || '') + ' ' + (error && error.message ? error.message : '');
          if (isExtensionOrCrossOriginError(errStr, url)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>
